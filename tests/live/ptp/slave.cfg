# (C) 2026 Doganalp Ergenc, written with the assistance of Claude
# ptp4l as the 802.1AS (gPTP) client of the Mininet demo (h2). Based on linuxptp's configs/gPTP.cfg.
#
# free_running 1 is essential: all Mininet hosts share the OS clock, and a ptp4l that adjusts "its" clock
# would adjust the clock of the machine. run_live.py refuses to start without it.
[global]
gmCapable		0
priority1		248
priority2		248
logAnnounceInterval	0
logSyncInterval		-3
syncReceiptTimeout	3
neighborPropDelayThresh	100000000
min_neighbor_prop_delay	-20000000
assume_two_step		1
path_trace_enabled	1
follow_up_info		1
transportSpecific	0x1
ptp_dst_mac		01:80:C2:00:00:0E
network_transport	L2
delay_mechanism		P2P
time_stamping		software
tx_timestamp_timeout	50
free_running		1
# Software timestamps on virtual links measure a peer delay far above 800 ns, and with the profile's default threshold the
# port never becomes asCapable, so it would not send Announce or Sync. Skip these checks; reset faults after a second.
asCapable		true
fault_reset_interval	0
